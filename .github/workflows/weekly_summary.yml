name: Weekly Summary Report

on:
  schedule:
    # 매주 월요일 KST 08:30 = UTC 일요일 23:30
    - cron: "30 23 * * 0"
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 24 강제 사용 (경고 제거)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly report pipeline
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          CLAUDE_MODEL:    ${{ vars.CLAUDE_MODEL    || 'claude-sonnet-4-6' }}
          GEMINI_MODEL:    ${{ vars.GEMINI_MODEL    || 'gemini-2.0-flash' }}
          OPENAI_MODEL:    ${{ vars.OPENAI_MODEL    || 'gpt-4o' }}
          DEEPSEEK_MODEL:  ${{ vars.DEEPSEEK_MODEL  || 'deepseek-chat' }}
          GROQ_MODEL:      ${{ vars.GROQ_MODEL      || 'llama-3.3-70b-versatile' }}
          MISTRAL_MODEL:   ${{ vars.MISTRAL_MODEL   || 'mistral-large-latest' }}
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          NOTION_DAILY_DB_ID:  ${{ secrets.NOTION_DAILY_DB_ID }}
          NOTION_WEEKLY_DB_ID: ${{ secrets.NOTION_WEEKLY_DB_ID }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS:   ${{ secrets.RECIPIENT_EMAILS }}
          PPT_OUTPUT_DIR: "/tmp"
          MD_OUTPUT_DIR:  "/tmp"
        run: python weekly_main.py

      - name: Upload Weekly Word + Markdown as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: |
            /tmp/semiconductor_brief_*.docx
            /tmp/semiconductor_brief_*.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Weekly report pipeline failed. Check the logs.')
