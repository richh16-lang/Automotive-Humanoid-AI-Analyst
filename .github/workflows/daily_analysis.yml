name: Daily News Analysis

on:
  schedule:
    # 매일 KST 08:00 = UTC 23:00 (전날)
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  daily-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily analysis pipeline
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          # ── LLM (하나 이상 설정 필수) ──
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          # ── 모델 (기본값 사용 시 생략 가능) ──
          CLAUDE_MODEL:  ${{ vars.CLAUDE_MODEL  || 'claude-sonnet-4-6' }}
          GEMINI_MODEL:  ${{ vars.GEMINI_MODEL  || 'gemini-2.0-flash' }}
          OPENAI_MODEL:  ${{ vars.OPENAI_MODEL  || 'gpt-4o' }}
          # ── Notion ──
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          NOTION_DAILY_DB_ID:  ${{ secrets.NOTION_DAILY_DB_ID }}
          NOTION_WEEKLY_DB_ID: ${{ secrets.NOTION_WEEKLY_DB_ID }}
          # ── Gmail ──
          GMAIL_ADDRESS:    ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          # ── PPT 저장 위치 ──
          PPT_OUTPUT_DIR: "/tmp"
        run: python main.py

      - name: Upload PPT as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ppt-${{ github.run_id }}
          path: /tmp/semiconductor_brief_*.pptx
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Daily analysis pipeline failed. Check the logs.')
